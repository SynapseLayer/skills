name: synapse-layer
description: >-
  Synapse Layer — Continuous Consciousness Infrastructure for AI Systems.
  Persistent, secure, 1-line integration. AES-256-GCM encryption, PII
  redaction, Trust Quotient scoring, and deterministic recall. MCP-native.
author: Ismael Marchi
homepage: https://synapselayer.org
repository: https://github.com/SynapseLayer/synapse-layer
pypi: synapse-layer
mcp_server: https://forge.synapselayer.org/api/mcp
version: "1.1.0"
keywords:
  - agent persistent memory
  - cross-model context transfer
  - zero-knowledge memory store
  - recall past conversation
  - encrypted context storage
  - agent memory MCP
  - long-term memory LLM
  - aes-256-gcm
  - continuous consciousness
  - sqlite backend
  - trust quotient
  - pii redaction
commands:
  - name: save_to_synapse
    description: Persist structured memory with full Cognitive Security pipeline
    usage: synapse save "<text>" --agent <id>
  - name: recall
    description: Deterministic memory retrieval ranked by Trust Quotient
    usage: synapse recall "<query>" --agent <id> [--limit 10]
  - name: process_text
    description: Auto-extract decisions, milestones and alerts from text
    usage: synapse process "<text>" --agent <id>
  - name: health_check
    description: System health, version, memory count and capability report
    usage: synapse health
